# /etc/fail2ban/filter.d/caddy-llm.conf — filter for the llm.peterek.net
# access log (Caddy JSON lines format).
# Managed by: scripts/setup/21-caddy.sh
#
# Matches unauthenticated requests (401) only. 403s are deliberately NOT
# matched: a legitimate key-holder calling a non-allowlisted path (e.g.
# /api/ps) would otherwise get its server IP banned.
# See docs/adr/0002-authenticated-llm-endpoint.md.

[Definition]
failregex = ^.*"remote_ip":"<HOST>".*"status":401[,}]
# Caddy's "ts" field is a mid-line float epoch. The bare Epoch/LongEpoch
# templates only match at line begin, so embed the epoch regex via {EPOCH}
# with the JSON key as prefix (verified with fail2ban-regex 1.0.2 against
# real Caddy 2.x log lines).
datepattern = "ts":{EPOCH}
