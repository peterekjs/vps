# /etc/systemd/system/caddy.service.d/env.conf — Caddy environment drop-in
# Managed by: scripts/setup/21-caddy.sh
#
# Loads the secret {$VAR} values (per-client LLM API keys) referenced by the
# Caddyfile. EnvironmentFile deliberately has no "-" prefix: if the env file
# is missing, Caddy must fail to start rather than come up with empty keys —
# an empty key would turn the auth matcher into `Bearer ` (nearly-open access).
# See docs/adr/0002-authenticated-llm-endpoint.md.
[Service]
EnvironmentFile=/etc/caddy/caddy.env
