# /etc/sysctl.d/99-hardening.conf — Kernel parameter hardening
# Managed by: scripts/setup/00-security-hardening.sh
# Apply with:  sysctl --system   (or: sysctl -p /etc/sysctl.d/99-hardening.conf)

# ---------------------------------------------------------------------------
# Network: IP spoofing & source routing
# ---------------------------------------------------------------------------
# Reverse-path filtering — drop packets with a source address that has no
# matching route back through the arriving interface (anti-spoofing).
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Do not accept IP source-route options
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# ---------------------------------------------------------------------------
# Network: ICMP
# ---------------------------------------------------------------------------
# Ignore ICMP echo requests sent to broadcast/multicast addresses
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Protect against bogus ICMP error responses
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Do NOT accept ICMP redirect messages (potential routing attacks)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Do NOT send ICMP redirect messages (we are not a router)
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# ---------------------------------------------------------------------------
# Network: TCP hardening
# ---------------------------------------------------------------------------
# Enable SYN flood protection via SYN cookies
net.ipv4.tcp_syncookies = 1

# Reduce the time to hold on to half-open connections
net.ipv4.tcp_syn_retries = 2
net.ipv4.tcp_synack_retries = 2

# Disable IP forwarding (this host is not a router)
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0

# Log packets with impossible source addresses (martians)
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Protect against TCP time-wait assassination attacks
net.ipv4.tcp_rfc1337 = 1

# ---------------------------------------------------------------------------
# Network: IPv6
# ---------------------------------------------------------------------------
# Disable router advertisements if IPv6 autoconfiguration is not needed
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0

# ---------------------------------------------------------------------------
# Kernel: memory & address space
# ---------------------------------------------------------------------------
# Restrict access to kernel logs to root
kernel.dmesg_restrict = 1

# Restrict kernel pointer exposure to root (mitigates info-leak attacks)
kernel.kptr_restrict = 2

# Disable the SysRq key (prevents console-based system control)
kernel.sysrq = 0

# Restrict ptrace scope — only parent processes may trace children by default
kernel.yama.ptrace_scope = 1

# Randomise virtual address space layout (ASLR) — maximum randomisation
kernel.randomize_va_space = 2

# ---------------------------------------------------------------------------
# Filesystem
# ---------------------------------------------------------------------------
# Restrict hard links — only the file owner may create hard links to it
fs.protected_hardlinks = 1

# Restrict symbolic links in sticky world-writable directories
fs.protected_symlinks = 1

# Restrict opening FIFOs/regular files in sticky world-writable directories
fs.protected_fifos = 2
fs.protected_regular = 2
